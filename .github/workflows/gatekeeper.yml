# Reusable workflow that reviews a pull request in two isolated jobs.
#
# Target repos call this workflow from their own `.github/workflows/pr-gatekeeper.yml`
# (see `templates/pr-gatekeeper.yml`). It checks out the PR head of the *target*
# repository, checks out pr-gatekeeper outside that tree, and runs the CLI.
#
# SECURITY: two jobs, because PR code and secrets must never share a runner.
# A process can read the environment of its parent: on Linux through
# /proc/<ppid>/environ, on macOS through `ps eww` (same user). So scrubbing
# the child environment is not enough, on either OS.
# - job `pr_body` reads the PR body with a read-only token and runs NO PR code;
#   it hands the body to job `gates` as an artifact.
# - job `gates` runs the deterministic stages (changes, static config, verify,
#   base compare, revert probe, Proof-of-work replay) on the PR code with NO
#   model/API secrets and no GH_TOKEN, and uploads the result as an artifact.
# - job `review` holds the secrets, never executes PR code, and reads the gate
#   results from the artifact instead of re-running the proof commands.
#
# RUNNER: job `gates` runs on the label in `gates_runs_on` (default
# ubuntu-latest; macos-latest for an iOS/macOS repo). Only GitHub-hosted
# labels (ubuntu-*, macos-*) are accepted: job `pr_body` rejects anything
# else, so a caller cannot point PR code at a self-hosted runner that keeps
# state between runs. On macOS the isolation is the same as on Linux: a fresh
# single-use VM per run, the two-job split (no secret and no token in the job
# that runs PR code) and the scrubbed child environment. Jobs `pr_body` and
# `review` always run on ubuntu-latest.

name: gatekeeper

on:
  workflow_call:
    inputs:
      # A string, not a number: a caller's workflow_dispatch input reaches
      # this input through an expression, and GitHub passes that value as a
      # string. A `number` input then fails the call before any job starts
      # ("Unexpected value '79'"), so a dispatched re-review never ran.
      pr:
        description: "Pull request number to review"
        required: true
        type: string
      base_sha:
        description: "SHA of the PR base (resolved by the caller; job gates must not call the GitHub API)"
        required: true
        type: string
      gatekeeper_ref:
        description: "pr-gatekeeper ref to check out"
        required: false
        type: string
        default: v1
      gates_runs_on:
        description: "GitHub-hosted runner label for job gates (the job that runs the PR's verify command): ubuntu-latest (default) or macos-latest for an iOS/macOS repo. Self-hosted labels are refused."
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      OPENCODE_GO_API_KEY:
        description: "API key for the reviewer/verifier models"
        required: true
      GATEKEEPER_READ_TOKEN:
        description: "Optional token that can read the private Ami-Khokhar/pr-gatekeeper repo"
        required: false

jobs:
  pr_body:
    # Reads the PR body for the Proof-of-work replay. It never checks out or
    # runs PR code, so its token never meets PR code; job `gates` gets the
    # body as a file and holds no token.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # `pr` is a string input, so it reaches the shell through env. Every
      # other job needs this one, so a bad value stops the whole review here.
      - name: Fetch the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          GATES_RUNS_ON: ${{ inputs.gates_runs_on }}
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error::input pr must be a PR number, got '$PR_NUMBER'"; exit 1 ;;
          esac
          # Job gates runs PR code: only a GitHub-hosted label may select its
          # runner. A self-hosted runner can keep state between runs.
          if ! printf '%s' "$GATES_RUNS_ON" | grep -Eqx '(ubuntu|macos)-[a-z0-9.-]+'; then
            echo "::error::input gates_runs_on must be a GitHub-hosted label (ubuntu-* or macos-*), got '$GATES_RUNS_ON'"; exit 1
          fi
          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json body -q .body > "$RUNNER_TEMP/pr-body.md"

      - name: Upload the PR body
        uses: actions/upload-artifact@v4
        with:
          name: pr-body-${{ inputs.pr }}
          path: ${{ runner.temp }}/pr-body.md
          retention-days: 1

  gates:
    # Deterministic stages on the PR code: no model API key, no GH_TOKEN.
    needs: pr_body
    runs-on: ${{ inputs.gates_runs_on }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # persist-credentials is false so that the checked-out PR code cannot
      # find a GitHub token in .git/config. fetch-depth 0 fetches all refs,
      # so the base commit is present for the merge-base computation.
      - name: Check out the target repository at the PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false

      # The tool is checked out and moved out of the reviewed tree BEFORE any
      # PR code runs, so it is never part of the diff and never writeable by
      # the PR.
      - name: Check out pr-gatekeeper
        uses: actions/checkout@v4
        with:
          repository: Ami-Khokhar/pr-gatekeeper
          ref: ${{ inputs.gatekeeper_ref }}
          path: .pr-gatekeeper-tool
          token: ${{ secrets.GATEKEEPER_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Move pr-gatekeeper outside the reviewed repository
        run: mv .pr-gatekeeper-tool "${{ runner.temp }}/pr-gatekeeper"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Download the PR body
        uses: actions/download-artifact@v4
        with:
          name: pr-body-${{ inputs.pr }}
          path: ${{ runner.temp }}/pr-body

      # PR code runs only here, in the `gates` job, with a scrubbed
      # environment (see gatekeeper/env.py). No secrets exist in this job.
      # base_sha is a string input, so it reaches the shell through env and
      # must be a full commit sha.
      - name: Run the deterministic gates
        working-directory: ${{ runner.temp }}/pr-gatekeeper
        env:
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          if ! printf '%s' "$BASE_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::input base_sha must be a 40-character commit sha"; exit 1
          fi
          python3 -m gatekeeper gates \
            --repo-dir "$GITHUB_WORKSPACE" \
            --base-ref-oid "$BASE_SHA" \
            --pr-body-file "$RUNNER_TEMP/pr-body/pr-body.md" \
            --out "$RUNNER_TEMP/gates.json"

      # Write the artifact outside the reviewed tree, so PR code cannot
      # rewrite it after it was produced.
      - name: Upload gates.json
        uses: actions/upload-artifact@v4
        with:
          name: gates-${{ inputs.pr }}
          path: ${{ runner.temp }}/gates.json
          retention-days: 1

  review:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
      actions: write
    steps:
      # The PR head is checked out for READING only: nothing here executes
      # repository code (the reviewer tools are read-only, and the gates
      # already ran in job `gates`).
      - name: Check out the target repository at the PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false

      # Safety net: make sure the base branch tip exists even if the initial
      # checkout missed it. The token is never echoed and the URL is never
      # printed (output is captured and scrubbed on failure).
      - name: Ensure the base branch refs exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          if ! out=$(git fetch --no-tags "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" +refs/heads/*:refs/remotes/origin/* 2>&1); then
            printf '%s\n' "$out" | sed -E 's#x-access-token:[^@]+@#x-access-token:***@#g'
            exit 1
          fi

      - name: Check out pr-gatekeeper
        uses: actions/checkout@v4
        with:
          repository: Ami-Khokhar/pr-gatekeeper
          ref: ${{ inputs.gatekeeper_ref }}
          path: .pr-gatekeeper-tool
          token: ${{ secrets.GATEKEEPER_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Move pr-gatekeeper outside the reviewed repository
        run: mv .pr-gatekeeper-tool "${{ runner.temp }}/pr-gatekeeper"

      - name: Download gates.json from job gates
        uses: actions/download-artifact@v4
        with:
          name: gates-${{ inputs.pr }}
          path: ${{ runner.temp }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The reviewer tools are read-only here; the deterministic gate results
      # come from gates.json (head_sha is re-checked against the PR head).
      # GH_TOKEN is for the `gh` publish steps only. `pr` is a string input,
      # so it reaches the shell through env and must be a number.
      - name: Run the review
        working-directory: ${{ runner.temp }}/pr-gatekeeper
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "::error::input pr must be a PR number, got '$PR_NUMBER'"; exit 1 ;;
          esac
          python3 -m gatekeeper review \
            --repo "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --repo-dir "$GITHUB_WORKSPACE" \
            --gates-json "$RUNNER_TEMP/gates.json"
